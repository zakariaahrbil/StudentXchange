spring.application.name=backend

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/
spring.datasource.username=postgres
spring.datasource.password=postgres

# Tell Hibernate to output the CREATE script to a file
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/db/migration/V1__init_schema.sql

# Use 'none' or 'create' while generating
spring.jpa.hibernate.ddl-auto=none

# Disable Flyway temporarily while generating the initial baseline script
spring.flyway.enabled=false